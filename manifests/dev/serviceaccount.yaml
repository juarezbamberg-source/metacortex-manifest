# ServiceAccount dedicada (regra 3.5) — nada de usar a default do namespace.
# automountServiceAccountToken: false (regra 3.4): a aplicação não fala com a
# API do cluster, então não recebe credencial nenhuma — e não tem RBAC algum.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-nyx
automountServiceAccountToken: false
