# Deployment da nyx-api — ambiente prod (namespace nyx-prod).
# Regras atendidas: 1.1/1.3/1.4 (identidade e seletor casando com o pod),
# 1.5 (dono e runbook), 1.6 (container "api"), 2.1 (requests e limits),
# 2.2 (readiness /readyz e liveness /healthz em endpoints distintos),
# 2.3 (replicas >= 2 em prod), 2.4 (RollingUpdate com maxUnavailable: 0),
# 2.6 (grace period de 40s para drenar), 3.1 (tag imutável, nunca :latest),
# 3.2 (securityContext completo + emptyDir para o que precisa escrever),
# 3.3 (DATABASE_URL por secretKeyRef — nada sensível em texto puro),
# 3.4 (automountServiceAccountToken: false), 3.5 (ServiceAccount dedicada),
# 3.7 (só registry interno).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-nyx
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyx-api
        app.kubernetes.io/instance: nyx-prod
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: api
        image: registry.metacortex.io/nyx/api:2.9.1
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: nyx-api
              key: app_env
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: nyx-api
              key: log_level
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nyx-db
              key: url
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
