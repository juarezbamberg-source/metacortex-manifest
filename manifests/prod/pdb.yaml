# PodDisruptionBudget (regra 2.5, prod): manutenção de nó não pode derrubar
# todas as réplicas ao mesmo tempo — pelo menos 1 fica de pé.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nyx-api
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-nyx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-prod
